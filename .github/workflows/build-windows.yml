name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3

      - run: uv sync --group dev

      - run: uv run pyinstaller --onefile --name attendance-agent agent.py

      - uses: actions/upload-artifact@v4
        with:
          name: attendance-agent-windows
          path: dist/attendance-agent.exe
